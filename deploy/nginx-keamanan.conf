# Perlindungan berkas sistem untuk pos.aldeftech.com
#
# Proyek ini tidak punya folder public/ - document root menunjuk ke akar
# proyek, jadi seluruh kode sumber berada di dalam jangkauan web. Tanpa
# berkas ini nginx menyajikan berkas apa pun yang ada: storage/logs/laravel.log
# (memuat query berikut nilainya dan potongan galat), composer.lock, sampai
# isi vendor/. Sudah pernah terjadi, diperiksa dengan curl dan memang 200.
#
# .htaccess di akar proyek TIDAK menolong - berkas itu hanya dibaca Apache.
#
# Yang boleh dibuka publik: assets/, uploads/, favicon.ico, robots.txt,
# dan index.php sebagai front controller.
#
# ---------------------------------------------------------------------
# Pemasangan (sesi ubuntu):
#
#   sudo mkdir -p /www/server/panel/vhost/nginx/extension/pos.aldeftech.com
#   sudo cp /www/wwwroot/pos.aldeftech.com/deploy/nginx-keamanan.conf \
#           /www/server/panel/vhost/nginx/extension/pos.aldeftech.com/keamanan.conf
#   sudo nginx -t && sudo nginx -s reload
#
# Ditaruh di folder extension, bukan di berkas vhost utama: vhost ditulis
# ulang aaPanel setiap kali pengaturan situs diubah lewat panel, dan
# perbaikan yang ditempel di sana akan hilang tanpa pemberitahuan.
# ---------------------------------------------------------------------

# Memakai "^~" dengan sengaja. Prefix location bertanda itu mengalahkan
# SELURUH location regex, termasuk penangan .php dari enable-php-84.conf
# yang di-include lebih dulu di vhost. Tanpa "^~", berkas .php di folder
# ini tetap akan dieksekusi meski aturannya ada.

location ^~ /app/          { deny all; }
location ^~ /bootstrap/    { deny all; }
location ^~ /config/       { deny all; }
location ^~ /database/     { deny all; }
location ^~ /deploy/       { deny all; }
location ^~ /resources/    { deny all; }
location ^~ /routes/       { deny all; }
location ^~ /storage/      { deny all; }
location ^~ /tests/        { deny all; }
location ^~ /vendor/       { deny all; }
location ^~ /node_modules/ { deny all; }

location = /artisan       { deny all; }
location = /composer.json { deny all; }
location = /composer.lock { deny all; }
location = /phpunit.xml   { deny all; }
location = /php.ini       { deny all; }

# Berkas unggahan disajikan, tidak pernah dijalankan. Ini menutup jalur
# unggah gambar yang isinya kode PHP.
location ^~ /uploads/ {
    expires 30d;
    location ~* \.(php|phtml|phar|php[0-9]|py|pl|sh|cgi|lua)$ { deny all; }
}
